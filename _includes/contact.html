<section class="contact" id="contact">
    <div class="container">
        <div class="section-title">
            <h2>Neem contact op!</h2>
            <p>Heb je een interessant idee of juist behoefte aan innovatieve concepten? Of eerst een kop koffie? Neem contact op!</p>
        </div>
        <div class="contact-form">
            <form>
                <div class="form-group">
                    <label for="name">Naam</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="organization">Organisatie</label>
                    <input type="text" id="organization" class="form-control">
                </div>
                <div class="form-group">
                    <label for="message">Bericht</label>
                    <textarea id="message" class="form-control" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Verstuur bericht</button>
            </form>
        </div>
    </div>
</section>
