<ul class="nav-links" id="nav-links">
    {% for status in site.data.statuses %}
    {% assign items = site.data.projects | where: "status", status.id %}
    {% if items.size > 0 %}<li><a href="{{ '/' | relative_url }}#{{ status.id }}">{{ status.label | remove: "Op de " | remove: "In de " | remove: "In het " | capitalize }}</a></li>{% endif %}
    {% endfor %}
</ul>
