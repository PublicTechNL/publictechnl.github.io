# Public Tech Hackathon-agenda: een verzameling hackathons, open hack dagen en andere momenten
# waarop publieke tech-concepten een stap verder komen. Iedereen kan een moment aanmelden
# (via de knop "Zet je hackathon erop": een GitHub-issue, of gewoon via contact).
#
#   id          - korte naam, uniek (ook voor de agendafeed)
#   naam        - naam van het moment
#   soort       - bijv. hackathon, open hack dag, sprint, workshop
#   datum       - JJJJ-MM-DD (eerste dag)
#   eind        - JJJJ-MM-DD (laatste dag, optioneel)
#   tijd        - bijv. "10:00–17:00" (optioneel)
#   plek        - stad of locatie (optioneel)
#   organisator - wie het organiseert, bijv. "PUBLIC TECH NL" of "Code for NL"
#   met         - medeorganisatoren (optioneel)
#   url         - meer informatie (optioneel)
#   aanmelden   - link om je aan te melden (optioneel)
#   beschrijving
#   concepten   - id's uit _data/projects.yml die er een stap zetten (optioneel)
#
# Voorbeeld:
#
# - id: hack-de-overheid-2026
#   naam: "Hack de Overheid"
#   soort: hackathon
#   datum: 2026-11-14
#   tijd: "10:00–18:00"
#   plek: "Utrecht"
#   organisator: "PUBLIC TECH NL"
#   met: "Code for NL"
#   url: "https://…"
#   aanmelden: "https://…"
#   beschrijving: "Een dag samen bouwen aan open oplossingen voor publieke vraagstukken."
#   concepten: [publicxs, zwammerdam-mastodon]

[]
