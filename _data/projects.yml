# Portfolio van het Public Tech NL Lab.
#
# Velden:
#   id                        - korte naam, ook bestandsnaam van de preview in assets/previews/
#   title, description        - publiek
#   url                       - link naar het project (optioneel; zonder url geen screenshot via het script)
#   preview_url               - andere pagina voor het screenshot dan url (optioneel)
#   repo                      - link naar de broncode (optioneel)
#   status                    - id uit _data/statuses.yml
#   partner                   - opdrachtgever of samenwerkingspartner (optioneel)
#   sinds                     - jaar van start (optioneel)
#   tags                      - lijst met trefwoorden (optioneel)
#   bijgewerkt                - wanneer je er laatst aan werkte, JJJJ-MM-DD (optioneel)
#   volgende_stap, notitie    - labjournaal: alleen zichtbaar bij lokaal `jekyll serve`

