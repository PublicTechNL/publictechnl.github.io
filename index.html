<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBLIC TECH NL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/atkinson-hyperlegible/2021-05-13/atkinson-hyperlegible.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --teal: #4b9f76;
            --navy: #1a2a3a;
        }
        
        body, html {
            height: 100%;
            font-family: 'Atkinson Hyperlegible', sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 90%;
        }
        
        .logo {
            margin-bottom: 40px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
        }
        
        .logo-icon {
            height: 130px;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1));
            margin-right: 30px;
        }
        
        .logo-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding-top: 15px;
        }
        
        .logo-text {
            font-size: 46px;
            font-weight: 700;
            color: var(--navy);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 1px;
            margin-bottom: 16px;
            line-height: 1.1;
        }
        
        .tagline {
            font-size: 24px;
            color: var(--teal);
            font-weight: 500;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.8s;
            margin-top: 8px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                flex-direction: column;
                text-align: center;
            }
            
            .logo-icon {
                height: 100px;
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .logo-content {
                align-items: center;
                text-align: center;
                padding-top: 0;
            }
            
            .logo-text {
                font-size: 32px;
            }
            
            .tagline {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg class="logo-icon" viewBox="-30 0 95 102.5" width="130" height="130" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4b9f76" />
                        <stop offset="100%" stop-color="#3d8962" />
                    </linearGradient>
                </defs>
                <path d="M 7.611354,4.4860243 A 30,30 0 0 0 -22.388367,34.485743 30,30 0 0 0 -22.388367,34.48626 v 72.49996 h 12.5000102 v -5.00021 h 9.9999104 a 5,5 0 0 0 5.00021,-4.999699 v -5.00021 h -5.00021 -9.9999104 v -7.4998 h 9.9999104 a 5,5 0 0 0 5.00021,-5.00021 v -5.00021 H -9.8883568 v -9.99991 H 7.611354 A 30,30 0 0 0 37.611584,34.485743 30,30 0 0 0 7.611354,4.4860243 Z m 0,12.5000117 A 17.5,17.5 0 0 1 25.111574,34.485743 17.5,17.5 0 0 1 7.611354,51.985967 H -9.8883568 V 34.485743 A 17.5,17.5 0 0 1 7.611354,16.986036 Z" fill="url(#logo-gradient)" />
            </svg>
            <div class="logo-content">
                <div class="logo-text">PUBLIC<br>TECH NL</div>
                <div class="tagline">Unlocking Public Innovation</div>
            </div>
        </div>
    </div>
</body>
</html>
